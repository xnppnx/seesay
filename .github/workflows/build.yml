name: Build CardputerZero deb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64 ninja-build curl
          python3 -m pip install --break-system-packages "cmake>=3.31"

      - name: Show versions
        run: |
          cmake --version
          aarch64-linux-gnu-g++ --version
          ninja --version

      - name: Fetch offline runtime payload (models, wheels, espeak-ng)
        run: bash tools/fetch-offline-payload.sh

      - name: Configure, build and package
        run: cmake --workflow --preset cp0-cross-package

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: cardputerzero-app
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30

  # Stage-0 benchmark: cross-build ncnn + ppocrv5 example for the device.
  # Only runs when manually dispatched (avoid slowing every normal build).
  build-ncnn:
    if: contains(github.event.head_commit.message, 'ncnn') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64 cmake ninja-build git

      - name: Fetch ncnn source
        run: |
          curl -sL https://github.com/Tencent/ncnn/archive/refs/tags/20261020.tar.gz -o ncnn.tar.gz
          tar xzf ncnn.tar.gz

      - name: Configure ncnn (cross, CPU only)
        run: |
          cmake -S ncnn-20261020 -B ncnn-build \
            -DCMAKE_TOOLCHAIN_FILE=ncnn-20261020/toolchains/aarch64-linux-gnu.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_VULKAN=OFF -DNCNN_BUILD_EXAMPLES=ON \
            -DNCNN_BUILD_BENCHMARK=ON -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_TOOLS=OFF

      - name: Build ncnn
        run: cmake --build ncnn-build -j4

      - name: Collect ncnn artifacts
        run: |
          mkdir -p ncnn-out
          cp ncnn-build/src/libncnn.a ncnn-out/ 2>/dev/null || true
          cp ncnn-build/benchmark/benchncnn ncnn-out/ 2>/dev/null || true
          cp ncnn-build/examples/ppocrv5 ncnn-out/ 2>/dev/null || true
          cp ncnn-20261020/benchmark/*.param ncnn-out/ 2>/dev/null || true
          ls -lh ncnn-out/

      - name: Upload ncnn build
        uses: actions/upload-artifact@v4
        with:
          name: ncnn-aarch64
          path: ncnn-out/*
          if-no-files-found: error
          retention-days: 30
