name: Build CardputerZero deb

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          # apt on shared runners is occasionally slow; retry the whole step.
          for i in 1 2 3; do
            sudo apt-get update && \
            sudo apt-get install -y crossbuild-essential-arm64 ninja-build curl unzip cmake && \
            break || echo "apt attempt $i failed, retrying..."
          done
          python3 -m pip install --break-system-packages "cmake>=3.31"

      - name: Show versions
        run: |
          cmake --version | head -1
          aarch64-linux-gnu-g++ --version | head -1

      - name: Fetch offline runtime payload (models, wheels, espeak-ng)
        run: bash tools/fetch-offline-payload.sh

      # ---- Stage-1: cross-build ncnn + C++ OCR subprocess ----
      - name: Fetch and cross-build ncnn (CPU only)
        run: |
          curl -sL https://github.com/Tencent/ncnn/archive/refs/tags/20261020.tar.gz -o ncnn.tar.gz
          tar xzf ncnn.tar.gz
          cmake -S ncnn-20261020 -B ncnn-build \
            -DCMAKE_TOOLCHAIN_FILE=ncnn-20261020/toolchains/aarch64-linux-gnu.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_VULKAN=OFF -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_TOOLS=OFF
          cmake --build ncnn-build --target ncnn -j4

      - name: Build seesay_ocr (C++ OCR subprocess)
        run: bash tools/build-ncnn-ocr.sh

      - name: Configure, build and package
        run: cmake --workflow --preset cp0-cross-package

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: cardputerzero-app
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
